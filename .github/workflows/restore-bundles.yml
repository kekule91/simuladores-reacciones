name: Restore simulator bundles
on:
  push:
    paths:
      - "hex-parts/**"
      - "restore_from_hex.py"
      - ".github/workflows/restore-bundles.yml"
  workflow_dispatch:
permissions:
  contents: write
jobs:
  restore:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Restore HTML/JS from hex gzip parts
        run: python3 restore_from_hex.py
      - name: Commit restored files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add velocidad/index.html equilibrio/index.html clasificador/index.html balanceador/assets/index-CQJLsIZd.js || true
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "Restore production HTML/JS from hex-parts (AI Studio export)"
            git push
          fi
